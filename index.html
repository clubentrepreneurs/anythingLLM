<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant IA UniCA</title>
    <style>
        body { 
            background: linear-gradient(135deg, #003576 0%, #005bb7 100%); 
            color: white; 
            font-family: 'Segoe UI', sans-serif;
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
        }
        .info { padding: 20px; max-width: 500px; }
        
        /* LA FAUSSE BULLE : Elle ressemble à la vraie, mais elle ne buggera jamais */
        .chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 9999;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        iframe { width: 100%; height: 100%; border: none; }

        @media (max-width: 500px) {
            .chat-container { width: 90%; height: 80%; bottom: 10px; right: 5%; }
        }
    </style>
</head>
<body>

    <div class="info">
        <h1>Assistant IA UniCA</h1>
        <p>Interface de démonstration - RAG (Retrieval-Augmented Generation)</p>
        <p>L'assistant est prêt à répondre à vos questions en bas à droite.</p>
    </div>

    <div class="chat-container">
        <iframe 
            src="https://frieda-isthmian-darci.ngrok-free.dev/e/44704d92-15e8-456c-8af3-86aed19346aa" 
            title="Chatbot">
        </iframe>
    </div>

</body>
</html>
