<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant UniCA - Démo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #003576 0%, #005bb7 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 400px;
        }
        h1 { margin-top: 0; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #ffffff;
            color: #003576;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .note { margin-top: 20px; font-size: 0.8rem; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Assistant IA</h1>
        <p>Bienvenue sur l'interface de démonstration de l'Université Côte d'Azur.</p>
        
        <a href="https://frieda-isthmian-darci.ngrok-free.dev" class="btn">Lancer l'Assistant →</a>
        
        <p class="note">Note : Si une page Ngrok apparaît, cliquez sur "Visit Site".</p>
    </div>

</body>
</html>
